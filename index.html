<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truth or Dare - Sleepover Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Sleeping bag pattern background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(255, 107, 107, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(100, 200, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(255, 200, 100, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            background: linear-gradient(145deg, #2d3561 0%, #1e2748 100%);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
            text-align: center;
            position: relative;
            z-index: 1;
            border: 2px solid rgba(255, 107, 107, 0.2);
        }

        h1 {
            color: #ff6b6b;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            font-weight: bold;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #64c8ff;
            margin-bottom: 30px;
            font-size: 1.1em;
            font-weight: bold;
        }

        .player-name {
            font-size: 2.5em;
            color: #ffc800;
            font-weight: bold;
            margin: 30px 0;
            padding: 25px;
            background: linear-gradient(145deg, #3d4870, #2d3561);
            border-radius: 15px;
            border: 2px solid #ffc800;
            box-shadow: 0 10px 30px rgba(255, 200, 0, 0.2);
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        .challenge {
            background: linear-gradient(145deg, #3d4870, #2d3561);
            padding: 30px;
            border-radius: 15px;
            margin: 20px 0;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 2px solid rgba(255, 107, 107, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .challenge-type {
            font-size: 1.3em;
            color: #64c8ff;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .challenge-text {
            font-size: 1.3em;
            color: #e0e0e0;
            font-weight: bold;
            line-height: 1.6;
        }

        button {
            padding: 14px 28px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            font-weight: bold;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .truth-btn {
            background: linear-gradient(145deg, #64c8ff, #3da9ff);
            color: #1a1a2e;
            border: 2px solid #64c8ff;
        }

        .dare-btn {
            background: linear-gradient(145deg, #ff6b6b, #ff4444);
            color: white;
            border: 2px solid #ff6b6b;
        }

        .next-btn {
            background: linear-gradient(145deg, #ffc800, #ffaa00);
            color: #1a1a2e;
            border: 2px solid #ffc800;
        }

        .reset-btn {
            background: linear-gradient(145deg, #555, #333);
            color: white;
            border: 2px solid #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛏️ TRUTH OR DARE 🛏️</h1>
        <p class="subtitle">October 8 Sleepover</p>

        <div class="player-name" id="playerName">KV</div>

        <div class="challenge" id="challengeBox">
            <div class="challenge-type" id="challengeType">Pick an option!</div>
            <div class="challenge-text" id="challengeText">Click Truth or Dare</div>
        </div>

        <div>
            <button class="truth-btn" onclick="playTruth()">Truth</button>
            <button class="dare-btn" onclick="playDare()">Dare</button>
        </div>

        <div>
            <button class="next-btn" onclick="nextPlayer()">Next Player</button>
            <button class="reset-btn" onclick="resetGame()">Reset Game</button>
        </div>
    </div>

    <script>
        const players = ["KV", "KS", "AD", "SD", "MIKU", "AK99"];

        const truths = [
            "What is the funniest thing you've ever done?",
            "What's your biggest secret?",
            "Who's your crush?",
            "What's your most embarrassing moment?",
            "What would you never do?",
            "What's your biggest fear?",
            "What's a lie you've told?",
            "What's your weirdest habit?",
            "Who in this room do you think is the funniest?",
            "What's something you wish people knew about you?",
            "What's the silliest thing you believe?",
            "What would you do for $1,000?"
        ];

        const dares = [
            "Do 10 jumping jacks",
            "Sing the alphabet backwards",
            "Dance like nobody's watching for 30 seconds",
            "Imitate someone in the group",
            "Tell a joke",
            "Do your best movie villain impression",
            "Speak in an accent for the next round",
            "Act like a sleepy cat",
            "Do a dramatic monologue",
            "Balance something on your head",
            "Do your silliest dance move",
            "Let someone choose what you eat next"
        ];

        let currentPlayer = 0;

        function updatePlayer() {
            document.getElementById('playerName').textContent = players[currentPlayer];
            document.getElementById('challengeType').textContent = 'Pick an option!';
            document.getElementById('challengeText').textContent = 'Click Truth or Dare';
        }

        function playTruth() {
            const truth = truths[Math.floor(Math.random() * truths.length)];
            document.getElementById('challengeType').textContent = 'TRUTH';
            document.getElementById('challengeText').textContent = truth;
        }

        function playDare() {
            const dare = dares[Math.floor(Math.random() * dares.length)];
            document.getElementById('challengeType').textContent = 'DARE';
            document.getElementById('challengeText').textContent = dare;
        }

        function nextPlayer() {
            currentPlayer = (currentPlayer + 1) % players.length;
            updatePlayer();
        }

        function resetGame() {
            currentPlayer = 0;
            updatePlayer();
        }

        updatePlayer();
    </script>
</body>
</html>
