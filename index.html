<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Truth or Dare - Sleepover Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(180deg, #0f172a 0%, #111827 30%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            position: relative;
            color: white;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at top, rgba(96, 165, 250, 0.22), transparent 40%),
                        radial-gradient(circle at bottom, rgba(239, 68, 68, 0.15), transparent 35%);
            pointer-events: none;
        }

        .container {
            width: min(100%, 640px);
            background: rgba(17, 24, 39, 0.85);
            border: 2px solid rgba(96, 165, 250, 0.5);
            border-radius: 22px;
            padding: 18px 18px 22px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.45);
            position: relative;
            z-index: 1;
        }

        h1 {
            text-align: center;
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            margin-bottom: 4px;
            color: #f8fafc;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: #93c5fd;
            font-size: 0.9rem;
            margin-bottom: 16px;
            font-weight: 700;
            letter-spacing: 1.2px;
        }

        .player-name {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            border-radius: 16px;
            text-align: center;
            padding: 16px 12px;
            font-weight: 900;
            font-size: clamp(1.8rem, 4.5vw, 2.6rem);
            color: white;
            margin-bottom: 14px;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .challenge {
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 18px;
            padding: 18px 16px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 16px;
        }

        .challenge-type {
            font-size: 0.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #7dd3fc;
            text-align: center;
            margin-bottom: 10px;
        }

        .challenge-text {
            font-size: clamp(1.05rem, 3.6vw, 1.4rem);
            line-height: 1.45;
            text-align: center;
            color: white;
            font-weight: 700;
        }

        .button-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .button-row.single {
            grid-template-columns: 1fr;
        }

        button {
            appearance: none;
            border: none;
            border-radius: 14px;
            padding: 14px 12px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            width: 100%;
            min-height: 52px;
            color: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transition: transform 0.12s ease;
        }

        button:active {
            transform: scale(0.98);
        }

        .truth-btn {
            background: linear-gradient(135deg, #34d399, #10b981);
            color: #052e16;
        }

        .dare-btn {
            background: linear-gradient(135deg, #f97316, #ef4444);
        }

        .next-btn {
            background: linear-gradient(135deg, #facc15, #f59e0b);
            color: #1f2937;
        }

        .reset-btn {
            background: linear-gradient(135deg, #64748b, #475569);
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 14px 14px 18px;
                border-radius: 18px;
            }

            .challenge {
                min-height: 170px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TRUTH OR DARE</h1>
        <p class="subtitle">OCTOBER 8 SLEEPOVER</p>

        <div class="player-name" id="playerName">KV</div>

        <div class="challenge" id="challengeBox">
            <div class="challenge-type" id="challengeType">Pick an option!</div>
            <div class="challenge-text" id="challengeText">Tap Truth or Dare</div>
        </div>

        <div class="button-row">
            <button class="truth-btn" onclick="playTruth()">Truth</button>
            <button class="dare-btn" onclick="playDare()">Dare</button>
        </div>

        <div class="button-row single">
            <button class="next-btn" onclick="nextPlayer()">Next Player</button>
        </div>

        <div class="button-row single">
            <button class="reset-btn" onclick="resetGame()">Reset Game</button>
        </div>
    </div>

    <script>
        const players = ["KV", "KS", "AD", "SD", "MIKU", "AK99"];

        const truths = [
            "What is the most embarrassing thing you have ever done?",
            "What is your biggest secret fear?",
            "Who in this room would you trust with your phone for a day?",
            "What is the weirdest text message you have ever sent?",
            "What is your biggest pet peeve?",
            "If you could switch lives with anyone here, who would it be?",
            "What is a lie you told your parents?",
            "What is the funniest thing you have ever seen a person do?",
            "What is something you are scared to admit about yourself?",
            "When was the last time you cried and why?",
            "What is a food you would never eat again?",
            "Who do you think is the most dramatic person here?",
            "What is something you want to do before you turn 18?",
            "What is your most chaotic opinion?",
            "What is something you completely fake at school or home?",
            "Who in this room do you think is the most likely to get in trouble?",
            "What is a small thing that instantly annoys you?",
            "What is the weirdest dream you have ever had?",
            "What is something you wish you were better at?",
            "What is your most embarrassing nickname?"
        ];

        const dares = [
            "Do 10 jumping jacks while saying your name in a robot voice.",
            "Sing the chorus of a song with a dramatic movie voice.",
            "Do a 30 second dance with no music.",
            "Act like a sleepy cat for 20 seconds.",
            "Give every person in the room a funny compliment.",
            "Say your name in 5 different accents.",
            "Do your best villain monologue for 15 seconds.",
            "Balance a water bottle on your head and walk across the room.",
            "Tell the funniest joke you know and try not to laugh.",
            "Imitate the most dramatic person in the room.",
            "Mimic a teacher, coach, or parent for 10 seconds.",
            "Pretend to be a celebrity walking into a room.",
            "Make the silliest face possible and hold it for 10 seconds.",
            "Give a fake speech about why you deserve a trophy.",
            "Do a dramatic movie entrance when the room says your name.",
            "Do the chicken dance for 20 seconds.",
            "Act like a zombie for 15 seconds and then say a funny line.",
            "Take a goofy selfie and make it your lock screen for the next round.",
            "Tell the group your weirdest fake excuse for being late.",
            "Do a slow motion walk across the room while everyone claps."
        ];

        let currentPlayer = 0;

        function updatePlayer() {
            document.getElementById('playerName').textContent = players[currentPlayer];
            document.getElementById('challengeType').textContent = 'Pick an option!';
            document.getElementById('challengeText').textContent = 'Tap Truth or Dare';
        }

        function playTruth() {
            const truth = truths[Math.floor(Math.random() * truths.length)];
            document.getElementById('challengeType').textContent = 'TRUTH';
            document.getElementById('challengeText').textContent = truth;
        }

        function playDare() {
            const dare = dares[Math.floor(Math.random() * dares.length)];
            document.getElementById('challengeType').textContent = 'DARE';
            document.getElementById('challengeText').textContent = dare;
        }

        function nextPlayer() {
            currentPlayer = (currentPlayer + 1) % players.length;
            updatePlayer();
        }

        function resetGame() {
            currentPlayer = 0;
            updatePlayer();
        }

        updatePlayer();
    </script>
</body>
</html>
